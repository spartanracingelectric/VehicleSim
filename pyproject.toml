[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vehiclesim"
version = "0.3.0"
description = "SR18 four-motor powertrain and planar vehicle models for SIL and model studies"
requires-python = ">=3.10"
dependencies = [
    "numpy",    # all the car itself needs (Vehicle/, Functions/)
]

[project.optional-dependencies]
# reading logs, plotting and running the regression suite
# install with: pip install -e ".[dev]"
dev = ["pandas", "matplotlib", "pytest"]

# Keep the established runtime namespaces; research and test code are not shipped.
[tool.setuptools.packages.find]
include = ["Vehicle*", "Functions*", "Data*"]
exclude = ["tests*", "examples*", "research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_functions = ["test*"]
